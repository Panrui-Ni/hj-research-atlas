</style></head><body><header><div class="topbar"><div class="brand"><span class="brandmark" aria-hidden="true">HJ</span><div class="brandtitle">Research <span>Atlas</span></div></div><nav class="mainnav" aria-label="Main navigation"><button class="navbtn active" data-nav="overview">Research areas</button><button class="navbtn" data-nav="index">Complete bibliography</button></nav><div class="topright"><a class="repo" href="https://github.com/Panrui-Ni/hj-research-atlas" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></div></header><div class="layout"><aside class="side"><div class="sidehead">Browse research areas</div><nav id="sideList" class="sidelist" aria-label="Research areas"></nav><p class="sidefooter">One primary area per paper. Cross-cutting methods and themes remain visible in the paper descriptions.</p></aside><main><div id="app"></div><footer id="footer" class="foot"></footer></main></div><script id="atlasData" type="application/json">{"version":"v9.2-classification-audit","updated":"2026-11-19","groups":[{"id":"foundations","name":"PDE foundations & methods","subtitle":"Viscosity comparison, adjoint techniques and PDE foundations","question":"What analytical principles are common to the different Hamilton–Jacobi problems?","tag":"Foundations","explain":"Comparison, nonlinear adjoints, basic viscosity methods."},{"id":"weak","name":"Weak KAM & Aubry–Mather theory","subtitle":"Aubry sets, Mather measures, critical solutions and global dynamics","question":"What structure do stationary critical solutions and minimizing trajectories possess?","tag":"Weak KAM","explain":"Classical weak KAM theory and Aubry–Mather structures."},{"id":"discount","name":"Vanishing discount & selection","subtitle":"Which critical solution is selected as a discount parameter vanishes?","question":"What selects a limit, and how does that mechanism depend on monotonicity or perturbation order?","tag":"Selection","explain":"Separate positive/nonlinear/negative/nonmonotone, counterexamples and rates."},{"id":"time","name":"Long-time behavior & semigroups","subtitle":"Asymptotics of time evolution, stability and solution sets","question":"What happens as t tends to infinity with the equation fixed?","tag":"Dynamics","explain":"Not the same limit as λ→0, even if the same operators appear."},{"id":"contact","name":"Contact HJ & nonlinear dynamics","subtitle":"Implicit variational principles, stability, periodicity and contact trajectories","question":"How does dependence on the unknown alter stationary solutions and dynamics?","tag":"Contact","explain":"Structure and trajectory dynamics, not automatically a discount selection problem."},{"id":"det","name":"Deterministic homogenization","subtitle":"Periodic, nonconvex, viscous and coupled-system homogenization","question":"How do rapidly oscillating deterministic structures produce effective equations and rates?","tag":"Homogenization","explain":"Includes convergence and rates for scalar equations and HJ systems. Stochastic homogenization remains separate."},{"id":"random","name":"Stochastic homogenization","subtitle":"Stationary ergodic spatial environments","question":"When is a deterministic effective HJ equation obtained in random media?","tag":"Random media","explain":"Separate from temporal stochastic forcing."},{"id":"visc","name":"Vanishing viscosity & viscous analysis","subtitle":"Zero-noise selection, competing limits and regularity","question":"How do second-order regularization and small viscosity change solution behavior?","tag":"Second order","explain":"Vanishing viscosity is not the same as viscous periodic homogenization."},{"id":"systems","name":"Hamilton–Jacobi systems","subtitle":"Weak coupling, switching, discount and multi-time equations","question":"How do coupled components or simultaneous Hamilton–Jacobi evolutions change solvability, asymptotics and selection?","tag":"Systems","explain":"Weak coupling and multi-time compatibility are distinct mathematical problems. Homogenization of systems is also cross-listed here."},{"id":"mfg","name":"Mean field games & mean field control","subtitle":"First-order and second-order games, master equations, discrete and contact MFG, and mean-field control","question":"How do HJ value equations interact with population equations and measure-valued states?","tag":"MFG","explain":"Game equilibrium, regularity, long-time behavior and homogenization."},{"id":"boundary","name":"Boundary value problems & state constraints","subtitle":"Neumann, Dirichlet, state constraints, perforated domains and related limits","question":"How do boundary conditions and domain constraints affect HJ equations?","tag":"Boundary","explain":"Boundary laws, state constraints, and homogenization in perforated domains."},{"id":"network","name":"Hamilton–Jacobi equations on networks & junctions","subtitle":"Flux limiters, vertex conditions, network dynamics and graph weak KAM","question":"How are Hamilton–Jacobi equations posed and solved at network vertices and junctions?","tag":"Networks","explain":"Network and junction models, distinct from boundary conditions on ordinary domains."},{"id":"singular","name":"Singularities & characteristics","subtitle":"Propagation, generalized curves and nonsmooth geometry","question":"How do singularities of viscosity solutions propagate?","tag":"Singularities","explain":"Generalized characteristics, topology and optimal transport."},{"id":"nona","name":"Non-autonomous Hamilton–Jacobi equations","subtitle":"Time dependence, recurrent and asymptotically periodic solutions","question":"How does explicit time dependence alter global viscosity solutions and their limits?","tag":"Time dependence","explain":"Non-autonomous Tonelli systems and recurrent dynamics."},{"id":"pathwise","name":"Pathwise & stochastic Hamilton–Jacobi equations","subtitle":"Rough temporal driving signals and pathwise solution theories","question":"How do time-dependent stochastic signals change well-posedness and regularity?","tag":"Pathwise","explain":"Stochastic time forcing, distinct from random spatial homogenization."},{"id":"metric","name":"Metric-space Hamilton–Jacobi theory","subtitle":"Nonsmooth spaces and generalized solution notions","question":"How do critical equations and solution concepts extend beyond Euclidean manifolds?","tag":"Metric spaces","explain":"Intrinsic action metrics and time-dependent Monge notions."},{"id":"appl","name":"Applications & models","subtitle":"Specialized HJ models and applied settings","question":"What distinct mathematical structures arise in models involving Hamilton–Jacobi equations?","tag":"Models","explain":"Application-specific models, not a miscellaneous collection of unrelated methods."},{"id":"numerical","name":"Numerical methods for Hamilton–Jacobi equations","subtitle":"Discretization, semi-Lagrangian methods, finite elements and policy iteration","question":"How can Hamilton–Jacobi solutions or effective Hamiltonians be approximated with rigorous convergence?","tag":"Numerical analysis","explain":"Numerical algorithms and error analysis, including cross-links to networks, optimal control and homogenization."},{"id":"largedev","name":"Large deviations and probabilistic limits","subtitle":"Large deviation rate functions and probabilistic HJ descriptions","question":"How do Hamilton–Jacobi equations encode limits of stochastic processes?","tag":"Probability","explain":"Large deviations is a probabilistic limit theory, not a numerical method."},{"id":"control","name":"Optimal control & reachability","subtitle":"Value functions, control equations and reachability","question":"How do Hamilton–Jacobi equations represent and approximate optimal-control value functions?","tag":"Control","explain":"Dynamic programming and reachability; see Numerical methods for numerical schemes."}],"lanes":{"foundations":[{"name":"Viscosity solution foundations","ids":["HJ-0125"]},{"name":"Nonlinear adjoint and compensated compactness","ids":["HJ-  const lanes=DATA.lanes[g.id];const order=DATA.groups.indexOf(g)+1;
 const samples=lanes.slice(0,3).map(l=>`<div class="miniline" title="${esc(l.name)}">${esc(l.name)}</div>`).join('');
 return `<button class="forestcard" data-area="${esc(g.id)}" aria-label="Open ${esc(g.name)} tree"><div class="foresttop"><span class="ordinal">${String(order).padStart(2,'0')} / ${DATA.groups.length}</span><span class="leafcount">${COUNT[g.id]} papers${XREF[g.id]>0?' · '+XREF[g.id]+' related':''}</span></div><h3>${esc(g.name)}</h3><p class="miniquestion">${esc(g.question)}</p><div class="minitree">${samples}</div><div class="forestbottom"><span>Explore ${lanes.length} subtopic${lanes.length===1?'':'s'}</span><span class="arrow">↗</span></div></button>`}).join(''):'<div class="forestempty">No matching research area. Try the complete bibliography to search authors or paper titles.</div>';
 };
 field.addEventListener('input',paint);paint();
}
function leaf(p,area){
 return `<article class="paperleaf" id="p-${esc(p.uid)}"><div class="leafmeta"><span class="year">${esc(p.year)}</span><span class="pid">${esc(p.uid)}</span>${p.primary!==area?`<span class="xref">Cross-listed · ${esc(G[p.primary]?.name||p.primary)}</span>`:''}</div><a class="leaf-title" href="${esc(source(p))}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a><div class="leaf-authors">${esc(p.authors)}</div>${p.contribution?`<div class="contrib">${esc(p.contribution)}</div>`:''}<div class="leaflinks"><a class="source" href="${esc(source(p))}" target="_blank" rel="noopener noreferrer">Original source ↗</a>${p.context||p.scope?`<button class="details" data-detail="${esc(p.uid)}" aria-expanded="false">Context & scope +</button>`:''}</div>${p.context||p.scope?`<div class="paperextra hidden" id="extra-${esc(p.uid)}">${p.context?`<p><strong>Context.</strong> ${esc(p.context)}</p>`:''}${p.scope?`<p><strong>Scope.</strong> ${esc(p.scope)}</p>`:''}</div>`:''}</article>`;
}
function renderTree(){
 const g=G[state.area];const lanes=DATA.lanes[g.id];const count=COUNT[g.id];
 el('app').innerHTML=`<button class="bread" data-goto="overview">← All research areas</button>`+heading(g.name,g.question,`<div class="stats"><span class="stat"><strong>${count}</strong><small>papers</small></span><span class="stat"><strong>${lanes.length}</strong><small>subtopics</small></span></div>`)+`<div class="treeheading"><div><h2>Research tree</h2><div class="aux">Subtopics branch from the research area; within each branch, papers are arranged by year.</div></div><div class="treeactions"><button class="btn" data-expand="all">Expand all</button><button class="btn" data-expand="none">Collapse all</button><button class="btn" data-goto="index" data-indexarea="${esc(g.id)}">View bibliography</button></div></div><div class="tree"><div class="root"><small>Research area</small><strong>${esc(g.name)}</strong><em>${count} primary papers${XREF[g.id]>0?' · '+XREF[g.id]+' cross-listed':''}</em></div><div class="branches">${lanes.map((lane,i)=>{
 const key=g.id+'|'+i;const closed=state.collapsed.has(key);
 const papers=sortYears(lane.ids.map(id=>PG[id]));
 return `<section class="branch ${closed?'closed':''}" data-branch="${esc(key)}"><button class="branchbar" data-toggle="${esc(key)}" aria-expanded="${!closed}"><span class="branchsymbol">${String(i+1).padStart(2,'0')}</span><span class="branchname">${esc(lane.name)}</span><span class="branchcount">${papers.length} paper${papers.length===1?'':'s'}</span><span class="caret">▾</span></button><div class="leaves">${papers.map(p=>leaf(p,g.id)).join('')}</div></section>`;
 }).join('')}</div></div><p class="endnote">Branching describes mathematical subtopics. The chronological order within a branch does not by itself imply that later papers generalize earlier ones. All ${count} primary papers are listed; relevant papers may also be cross-listed from another research area. Each paper appears once in the complete bibliography.</p>`;
}
function bibCard(p){
 return `<article class="bib-paper"><div class="bibtop"><span class="pid">${esc(p.uid)}</span><span class="year">${esc(p.year)}</span><span class="bibgroup">${esc(G[p.primary]?.name||p.primary)}</span></div><a class="bibtitle" href="${esc(source(p))}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a><div class="leaf-authors">${esc(p.authors)}</div>${p.contribution?`<div class="contrib">${esc(p.contribution)}</div>`:''}<div class="leaflinks"><a href="${esc(source(p))}" target="_blank" rel="noopener noreferrer" class="source">Original source ↗</a><button class="details" data-area="${esc(p.primary)}">View research tree ↗</button></div></article>`;
}
function renderIndex(){
 const opts=DATA.groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)} (${COUNT[g.id]})</option>`).join('');
 el('app').innerHTML=heading('Complete bibliography','All indexed research papers, with a single primary research area for browsing. Search by paper title, author, year, mathematical result or HJ ID.',`<div class="stats"><span class="stat"><strong>${DATA.papers.length}</strong><small>research papers</small></span></div>`)+`<div class="paper-toolbar"><label class="searchbox"><input type="search" id="paperSearch" placeholder="Search papers, authors, methods, ID…" aria-label="Search bibliography"></label><select id="bibArea" aria-label="Filter by area"><option value="">All research areas</option>${opts}</select><select id="bibOrder" aria-label="Sort papers"><option value="old">Oldest first</option><option value="recent">Newest first</option><option value="title">Title A–Z</option></select></div><div class="results" id="bibCount"></div><div class="bibliography" id="bibResults"></div><section class="booksection"><h2>Books & lecture notes</h2><div class="bookgrid">${(DATA.references||[]).map(b=>`<article class="book"><h3><a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">${esc(b.title)}</a></h3><p>${esc(b.authors)} · ${esc(b.year)}</p><p>${esc(b.description||'')}</p></article>`).join('')}</div></section>`;
 el('paperSearch').value=state.q||'';el('bibArea').value=state.bibArea||'';el('bibOrder').value=state.sort;
 const paint=()=>{
 const q=el('paperSearch').value.trim();const a=el('bibArea').value;const order=el('bibOrder').value;
 state.q=q;state.bibArea=a;state.sort=order;
 let papers=DATA.papers.filter(p=>(!a||p.primary===a)&&match(p,q));
 papers.sort(order==='recent'?(x,y)=>y.year-x.year||x.uid.localeCompare(y.uid):order==='title'?(x,y)=>x.title.localeCompare(y.title): (x,y)=>x.year-y.year||x.uid.localeCompare(y.uid));
 el('bibCount').textContent=`Showing ${papers.length} of ${DATA.papers.length} research papers${a?' in '+G[a].name:''}`;
 el('bibResults').innerHTML=papers.length?papers.map(bibCard).join(''):'<p>No papers match these filters.</p>';
 };
 ['paperSearch','bibArea','bibOrder'].forEach(id=>el(id).addEventListener(id==='paperSearch'?'input':'change',paint));paint();
}
function render(){
 renderNav();
 if(state.view==='tree')renderTree();else if(state.view==='index')renderIndex();else renderOverview();
 el('footer').innerHTML=`Curated research bibliography · ${DATA.papers.length} papers · ${DATA.groups.length} research areas · Updated ${esc(DATA.updated)}. Classifications and summaries reflect the bibliography's current editorial organization, not a complete account of the field.`;
}
document.addEventListener('click',e=>{
 const elmt=e.target.closest('[data-area],[data-goto],[data-nav],[data-toggle],[data-expand],[data-detail]');
 if(!elmt)return;
 if(elmt.hasAttribute('data-area')){setView('tree',elmt.dataset.area);return;}
 if(elmt.hasAttribute('data-goto')){
 const v=elmt.dataset.goto;
 if(v==='index' && elmt.dataset.indexarea)state.bibArea=elmt.dataset.indexarea;
 else if(v==='index')state.bibArea='';
 setView(v);return;
 }
 if(elmt.hasAttribute('data-nav')){if(elmt.dataset.nav==='index')state.bibArea='';setView(elmt.dataset.nav);return;}
 if(elmt.hasAttribute('data-toggle')){const k=elmt.dataset.toggle;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);const b=elmt.closest('.branch');b.classList.toggle('closed',state.collapsed.has(k));elmt.setAttribute('aria-expanded',String(!state.collapsed.has(k)));return;}
 if(elmt.hasAttribute('data-expand')){const all=elmt.dataset.expand==='all';document.querySelectorAll('.branch').forEach(b=>{const k=b.dataset.branch;if(all)state.collapsed.delete(k);else state.collapsed.add(k);b.classList.toggle('closed',!all);b.querySelector('.branchbar').setAttribute('aria-expanded',String(all));});return;}
 if(elmt.hasAttribute('data-detail')){const d=document.getElementById('extra-'+elmt.dataset.detail);if(!d)return;const showing=d.classList.toggle('hidden');elmt.setAttribute('aria-expanded',String(!showing));elmt.textContent=showing?'Context & scope +':'Context & scope −';}
});
function start(){
 const hash=decodeURIComponent(location.hash.slice(1));
 if(hash.startsWith('area=')&&G[hash.slice(5)]){state.view='tree';state.area=hash.slice(5)}
 else if(hash==='bibliography')state.view='index';
 render();
}
start();
</script></body></html>
